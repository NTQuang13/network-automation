name: netauto
mgmt:
  network: netauto-mgmt
  ipv4-subnet: 172.30.20.0/24
topology:
  kinds:
    arista_ceos:
      image: ceos:4.37.0F
    linux:
      image: alpine:latest
  nodes:
    core1: { kind: arista_ceos, mgmt-ipv4: 172.30.20.11 }
    core2: { kind: arista_ceos, mgmt-ipv4: 172.30.20.12 }
    acc1: { kind: arista_ceos, mgmt-ipv4: 172.30.20.21 }
    acc2: { kind: arista_ceos, mgmt-ipv4: 172.30.20.22 }
    h1:
      kind: linux
      exec:
        - ip addr add 10.10.10.101/24 dev eth1
        - ip route replace default via 10.10.10.1
    h2:
      kind: linux
      exec:
        - ip addr add 10.20.20.101/24 dev eth1
        - ip route replace default via 10.20.20.1
  links:
    - endpoints: ["core1:eth1", "core2:eth1"]
    - endpoints: ["core1:eth2", "acc1:eth1"]
    - endpoints: ["core2:eth2", "acc2:eth1"]
    - endpoints: ["acc1:eth2", "h1:eth1"]
    - endpoints: ["acc2:eth2", "h2:eth1"]
